:root{
  --bg:#E9EFEC; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#0E2A25; --ink-2:#4B635D; --ink-3:#86978F;
  --brand:#0E3B34; --brand-2:#14574C; --on-brand:#F3F7F1; --gold:#B98428; --gold-soft:#F5E9CF;
  --ok:#2E7D57; --ok-soft:#DDF0E5; --warn:#B4532A; --warn-soft:#F8E3D8; --line:#D6E0DB;
  --shadow:0 1px 2px rgba(14,42,37,.06),0 8px 24px -12px rgba(14,42,37,.18);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1A17; --surface:#132622; --surface-2:#18302B; --ink:#E6EFEA; --ink-2:#A9BDB5; --ink-3:#6F857D;
  --brand:#1B5A4F; --brand-2:#237060; --on-brand:#F3F7F1; --gold:#E0B25A; --gold-soft:#3A2F17;
  --ok:#5BBE8A; --ok-soft:#173A2A; --warn:#F08A5D; --warn-soft:#3D2216; --line:#23403A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1A17; --surface:#132622; --surface-2:#18302B; --ink:#E6EFEA; --ink-2:#A9BDB5; --ink-3:#6F857D;
  --brand:#1B5A4F; --brand-2:#237060; --on-brand:#F3F7F1; --gold:#E0B25A; --gold-soft:#3A2F17;
  --ok:#5BBE8A; --ok-soft:#173A2A; --warn:#F08A5D; --warn-soft:#3D2216; --line:#23403A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ===== shell ===== */
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 20px 10px;display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.3px;flex:1}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.off i{background:var(--ink-3)} .sync.busy i{background:var(--gold);animation:pulse 1s infinite}
.beta-tag{font-size:11px;font-weight:700;background:var(--gold-soft);color:var(--gold);padding:2px 8px;border-radius:99px}
@keyframes pulse{50%{opacity:.3}}
main{padding:0 16px 130px}
.view{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
.view.fromLeft{animation-name:viewInL}
@keyframes viewIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes viewInL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav-in{max-width:528px;margin:0 auto;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;padding:6px;pointer-events:auto;position:relative}
.nav button.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;font-size:12px;font-weight:600;color:var(--ink-3);border-radius:18px;transition:color .2s}
.nav button.tab svg{width:23px;height:23px}
.nav button.tab.on{color:var(--brand-2)}
:root[data-theme="dark"] .nav button.tab.on{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button.tab.on{color:var(--gold)}}
.fab-slot{width:76px;display:flex;justify-content:center}
.fab{width:60px;height:60px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-top:-34px;box-shadow:0 10px 24px -8px rgba(14,59,52,.55);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px}

/* ===== hero ===== */
.hero{background:var(--brand);color:var(--on-brand);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden;margin-bottom:18px}
.hero::after{content:"";position:absolute;inset:auto -60px -90px auto;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero .lbl{font-size:13px;opacity:.75}
.hero .days{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px}
.hero .days b{font-size:64px;line-height:1;font-weight:900;letter-spacing:-2px}
.hero .days span{font-size:18px;font-weight:700;opacity:.85}
.hero .what{font-size:17px;font-weight:700}
.hero .meta{display:flex;gap:16px;margin-top:12px;font-size:13px;opacity:.85;flex-wrap:wrap}
.hero .amt{color:var(--gold-soft);font-weight:800}
.hero .pay-hero{position:absolute;left:16px;bottom:16px;z-index:2;background:var(--gold);color:#1d1606;font-weight:800;padding:9px 16px;border-radius:14px;font-size:14px}
.hero.empty b{font-size:22px}
.month-sum{display:flex;gap:10px;margin-bottom:18px}
.month-sum div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.month-sum small{display:block;color:var(--ink-3);font-size:12px}
.month-sum strong{font-size:18px;font-weight:800}

/* ===== due list ===== */
.group-h{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 6px 8px;display:flex;justify-content:space-between}
.group-h.overdue{color:var(--warn)}
.due{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;transition:transform .35s,opacity .35s,max-height .4s .1s,margin .4s .1s,padding .4s .1s;max-height:120px;overflow:hidden}
.due.late{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:linear-gradient(90deg,var(--surface),var(--warn-soft))}
.due .chip{min-width:54px;text-align:center;border-radius:12px;padding:6px 4px;background:var(--surface-2);line-height:1.2}
.due .chip b{display:block;font-size:20px;font-weight:800}
.due .chip small{font-size:11px;color:var(--ink-3)}
.due.late .chip{background:var(--warn);color:#fff}.due.late .chip small{color:#fff;opacity:.85}
.due.soon .chip{background:var(--gold-soft);color:var(--gold)}
.due .info{flex:1;min-width:0}
.due .info h4{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due .info p{font-size:12.5px;color:var(--ink-3)}
.due .amt{font-weight:800;font-size:15px;white-space:nowrap}
.paybtn{width:40px;height:40px;border-radius:13px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ok);flex-shrink:0;transition:background .2s}
.paybtn:active{background:var(--ok-soft)}
.paybtn svg{width:20px;height:20px}
.due.going{transform:translateX(-40px);opacity:0;max-height:0;margin:0;padding-top:0;padding-bottom:0}
.more{display:block;margin:12px auto;color:var(--brand-2);font-weight:700;padding:8px 18px;border-radius:12px;background:var(--surface-2)}

/* ===== plan cards ===== */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:168px;position:relative;transition:transform .2s,opacity .5s,filter .5s}
.card:active{transform:scale(.97)}
.card .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--on-brand);background:var(--brand-2)}
.card h3{font-size:16px;font-weight:800;line-height:1.35;margin-top:4px}
.card .sub{font-size:12px;color:var(--ink-3)}
.card .bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:auto}
.card .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.card.done{opacity:.5;filter:grayscale(.85)}
.card.done .ic{background:var(--ink-3)}
.card .stamp{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;color:var(--ok);border:1.5px solid var(--ok);border-radius:8px;padding:0 6px;transform:rotate(-8deg)}
.card .late-dot{position:absolute;top:14px;left:14px;width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.sec-title{font-size:13px;font-weight:700;color:var(--ink-3);margin:22px 6px 10px}

/* ===== empty ===== */
.empty-state{text-align:center;padding:48px 24px;color:var(--ink-2)}
.empty-state .big{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:6px}
.empty-state button{margin-top:16px}

/* ===== buttons/forms ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink);transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.gold{background:var(--gold);color:#1d1606}
.btn.danger{color:var(--warn)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:4px}

function schedule(p){
  const out = [], step = STEP[p.freq] || 1, pay = p.payments || {};
  for (let i = 1; i <= (p.count||0); i++){
    let amt = +p.amount || 0;
    if (i === +p.count && +p.lastAmount) amt = +p.lastAmount;
    for (const ph of (p.phases||[])) if (i >= +ph.from && i <= +ph.to) amt = +ph.amount;
    const key = "i:" + i;
    out.push({key, no:i, label:"قسط " + num(i) + " من " + num(p.count), date:addMonths(p.firstDate, (i-1)*step), amount:amt, pay:pay[key]||null});
  }
  for (const e of (p.extras||[])){
    const n = +e.repeatMonths ? Math.max(1, +e.times||1) : 1;
    for (let k = 0; k < n; k++){
      const key = "x:" + e.id + ":" + k;
      out.push({key, extra:true, label:(e.label||"دفعة إضافية") + (n>1 ? " (" + num(k+1) + ")" : ""), date:addMonths(e.date, k*(+e.repeatMonths||0)), amount:+e.amount||0, pay:pay[key]||null});
    }
  }
  out.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return out;
}

}

/* ================= view: due ================= */
function allDue(){
  const out = [];
  for (const r of activePlans()){
    const p = r.data; if (p.completed) continue;
    for (const it of schedule(p)) if (!it.pay) out.push({...it, planId:r.id, plan:p});
  }
  out.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return out;
}
function viewDue(){
  const items = allDue(), t = todayISO();
  if (!activePlans().length) return emptyState("لسه مفيش أقساط", "دوس على + تحت وضيف أول قسط، وهيظهر هنا مترتب بالأقرب.");
  if (!items.length) return emptyState("مفيش أقساط مستحقة", "كل الأقساط النشطة اتدفعت. برافو!");
  const first = items[0], d = daysBetween(t, first.date);
  const monthKey = t.slice(0,7);
  const monthTotal = items.filter(i => i.date.slice(0,7) === monthKey || i.date < t).reduce((s,i) => s + i.amount, 0);
  const lateCount = items.filter(i => i.date < t).length;
  let html = `<section class="hero" aria-label="أقرب قسط">
    <div class="lbl">${d < 0 ? "قسط متأخر" : "أقرب قسط"}</div>
    <div class="days">${d === 0 ? "<b>النهارده</b>" : d === 1 ? "<b>بكرة</b>" : `<b class="num">${num(Math.abs(d))}</b><span>${d < 0 ? "يوم تأخير" : "يوم"}</span>`}</div>
    <div class="what">${esc(first.plan.name)}</div>
    <div class="meta"><span>${esc(first.label)}</span><span>${fdate(first.date)}</span><span class="amt">${money(first.amount)}</span></div>
    <button class="pay-hero" data-pay="${first.planId}|${first.key}">دفعت</button>
  </section>
  <div class="month-sum">
    <div><small>مطلوب الشهر ده</small><strong class="num">${money(monthTotal)}</strong></div>
    <div><small>${lateCount ? "أقساط متأخرة" : "الأقساط الجاية"}</small><strong class="num" style="${lateCount ? "color:var(--warn)" : ""}">${num(lateCount || items.length)}</strong></div>
  </div>`;
  const shown = items.slice(1, S.dueLimit + 1);
  let cur = "";
  for (const it of shown){
    const late = it.date < t, g = late ? "late" : it.date.slice(0,7);
    if (g !== cur){
      cur = g;
      const sum = shown.filter(x => (x.date < t ? "late" : x.date.slice(0,7)) === g).reduce((s,x) => s + x.amount, 0);
      html += `<div class="group-h ${late ? "overdue" : ""}"><span>${late ? "متأخرة" : dfMonth.format(new Date(g + "-01T00:00:00Z"))}</span><span class="num">${money(sum)}</span></div>`;
    }
    html += dueRow(it, t);
  }
  if (items.length > S.dueLimit + 1) html += `<button class="more" id="more">عرض المزيد (${num(items.length - S.dueLimit - 1)})</button>`;
  return html;
}
function dueRow(it, t){
  const d = daysBetween(t, it.date), late = d < 0, soon = d >= 0 && d <= 7;
  const day = new Date(it.date + "T00:00:00Z");
  return `<div class="due ${late ? "late" : soon ? "soon" : ""}" data-row="${it.planId}|${it.key}">
    <div class="chip"><b class="num">${num(day.getUTCDate())}</b><small>${new Intl.DateTimeFormat("ar-EG",{month:"short",timeZone:"UTC"}).format(day)}</small></div>
    <div class="info" data-open="${it.planId}"><h4>${esc(it.plan.name)}</h4><p>${esc(it.label)} · ${relDays(d)}</p></div>
    <div class="amt num">${money(it.amount)}</div>
    <button class="paybtn" data-pay="${it.planId}|${it.key}" aria-label="تسجيل دفع ${esc(it.plan.name)}">${ICON.check}</button>
  </div>`;
}
function emptyState(t, d){ return `<div class="empty-state"><div class="big">${t}</div><p>${d}</p><button class="btn primary" data-add>${ICON.plus.replace('<svg','<svg width="18" height="18"')} إضافة قسط</button></div>`; }

function viewPlans(){
  const rows = activePlans();

  const t = todayISO();
  const withStats = rows.map(r => ({r, s:planStats(r.data)}));
  const act = withStats.filter(x => !x.r.data.completed).sort((a,b) => (a.s.next?.date||"9") < (b.s.next?.date||"9") ? -1 : 1);
  const done = withStats.filter(x => x.r.data.completed).sort((a,b) => (b.r.data.completedAt||"") < (a.r.data.completedAt||"") ? -1 : 1);
  const totalRem = act.reduce((s,x) => s + x.s.remaining, 0);
  let html = `<div class="month-sum"><div><small>أقساط نشطة</small><strong class="num">${num(act.length)}</strong></div><div><small>إجمالي المتبقي</small><strong class="num">${money(totalRem)}</strong></div></div>`;
  html += `<div class="cards">${act.map(x => card(x, t)).join("")}</div>`;
  if (done.length) html += `<div class="sec-title">خلصت</div><div class="cards">${done.map(x => card(x, t)).join("")}</div>`;

}

/* ================= sheet ================= */
let sheetStack = 0;
function openSheet(title, body, opts={}){
  closeSheet(true);
  const L = $("#layer");
  L.innerHTML = `<div class="scrim"></div><div class="sheet ${opts.cls||""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grip"></div>
    <div class="sh-head">${opts.head || ""}<h2>${esc(title)}</h2><button class="iconbtn" id="shx" aria-label="إغلاق">${ICON.close}</button></div>
    <div class="sh-body">${body}</div></div>`;
  const sc = $(".scrim", L), sh = $(".sheet", L);
  requestAnimationFrame(() => { sc.classList.add("on"); sh.classList.add("on"); });
  sc.onclick = () => closeSheet(); $("#shx").onclick = () => closeSheet();
  // swipe down to close
  let y0 = null; const g = $(".grip", L);
  const head = $(".sh-head", L);
  [g, head].forEach(el => {
    el.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; sh.style.transition = "none"; }, {passive:true});
    el.addEventListener("touchmove", e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
    el.addEventListener("touchend", e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transition = ""; sh.style.transform = ""; y0 = null; if (dy > 90) closeSheet(); });
  });
  document.addEventListener("keydown", escClose);
  return sh;
}
function escClose(e){ if (e.key === "Escape") closeSheet(); }
function closeSheet(instant){
  const L = $("#layer"), sh = $(".sheet", L), sc = $(".scrim", L);
  document.removeEventListener("keydown", escClose);
  if (!sh) return;
  if (instant){ L.innerHTML = ""; return; }
  sh.classList.remove("on"); sc.classList.remove("on");
  setTimeout(() => { if ($(".sheet:not(.on)", L)) L.innerHTML = ""; }, 380);
}
let toastT;
function toast(msg, action){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML = esc(msg) + (action ? `<button>${esc(action.label)}</button>` : "");
  if (action) t.querySelector("button").onclick = () => { action.fn(); t.classList.remove("on"); };
  requestAnimationFrame(() => t.classList.add("on"));
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), action ? 5000 : 2400);
}
function celebrate(){
  const c = document.createElement("div"); c.className = "celebrate";
  let coins = ""; for (let i = 0; i < 12; i++){ const a = i/12*Math.PI*2, r = 90 + Math.random()*50; coins += `<span class="coin" style="--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;animation-delay:${.15+Math.random()*.1}s"></span>`; }
  c.innerHTML = `<div class="ring2"></div>${coins}<div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>`;
  document.body.appendChild(c);
  if (navigator.vibrate) navigator.vibrate(30);
  setTimeout(() => c.classList.add("out"), 900); setTimeout(() => c.remove(), 1250);
}

/* ================= pay ================= */
function openPay(pid, key, rowEl){
  const r = S.plans[pid]; if (!r) return;
  const it = schedule(r.data).find(x => x.key === key); if (!it) return;
  openSheet("تسجيل دفع", `<div class="dialog">
    <p style="text-align:center;color:var(--ink-2)">${esc(r.data.name)} · ${esc(it.label)}<br><small>مستحق ${fdate(it.date)}</small></p>
    <label for="pa" class="hidden">المبلغ المدفوع</label>
    <input id="pa" class="amount-big num" inputmode="decimal" value="${it.amount}">
    <p style="text-align:center;font-size:12px;color:var(--ink-3);margin-bottom:14px">لو دفعت مبلغ مختلف (غرامة أو خصم) عدّله هنا</p>
    <div class="field"><label for="pd">تاريخ الدفع</label><input id="pd" type="date" class="input" value="${todayISO()}"></div>
    <div class="field"><label for="pn">ملاحظة (اختياري)</label><input id="pn" class="input" placeholder="مثلاً: اتدفع كاش"></div>
    <button class="btn gold block" id="pok">تأكيد الدفع</button></div>`);
  $("#pok").onclick = () => {
    const amount = parseFloat(String($("#pa").value).replace(/[^\d.]/g,"")); if (!(amount >= 0)) return $("#pa").focus();
    const data = structuredClone(r.data); data.payments = data.payments || {};
    data.payments[key] = {amount, paidAt:$("#pd").value || todayISO(), note:$("#pn").value.trim() || undefined};
    closeSheet(); celebrate();
    const target = rowEl || document.querySelector(`[data-row="${pid}|${key}"]`);
    if (target){ target.classList.add("going"); setTimeout(() => { putPlan(pid, data); renderView(false); }, 450); } else { putPlan(pid, data); setTimeout(() => renderView(false), 300); }
    const allPaid = schedule(data).every(x => x.pay);
    setTimeout(() => toast(allPaid ? "دي كانت آخر دفعة! تقدر تقفل القسط من الكارت" : "اتسجل الدفع", {label:"تراجع", fn:() => { const d2 = structuredClone(S.plans[pid].data); delete d2.payments[key]; putPlan(pid, d2); renderView(false); }}), 500);
  };
}

/* ================= detail ================= */
let tlFilter = "all";
function openDetail(pid){
  const r = S.plans[pid]; if (!r) return;
  tlFilter = r.data.completed ? "all" : "all";
  openSheet(r.data.name, detailHTML(r), {head:`<button class="iconbtn" id="dEdit" aria-label="تعديل">${ICON.edit}</button>`});
  bindDetail(pid);
  requestAnimationFrame(() => requestAnimationFrame(() => { const fg = $(".ring .fg"); if (fg) fg.style.strokeDashoffset = fg.dataset.o; }));
}
function detailHTML(r){
  const p = r.data, s = planStats(p), t = todayISO(), C = 2*Math.PI*37;
  const items = s.items.filter(it => tlFilter === "all" ? true : tlFilter === "paid" ? it.pay : !it.pay);
  let tl = "";
  for (const it of items){

      <div class="a num">${money(it.pay ? it.pay.amount : it.amount)}${it.pay && +it.pay.amount !== +it.amount ? `<small>المستحق ${money(it.amount)}</small>` : ""}</div>
      ${p.completed ? "" : it.pay ? `<button class="tl-act" data-unpay="${it.key}">إلغاء</button>` : `<button class="tl-act" data-dpay="${it.key}">دفعت</button>`}

    <div class="d-stats">
      <div><small>اتدفع</small><strong class="num">${money(s.paid)}</strong></div>
      <div><small>المتبقي</small><strong class="num">${money(s.remaining)}</strong></div>
      <div><small>الأقساط</small><strong class="num">${num(s.paidCount)} من ${num(s.count)}</strong></div>
      <div><small>النوع</small><strong>${FREQ_AR[p.freq]}</strong></div>
    </div></div>
    ${p.totalAmount ? `<p style="font-size:13px;color:var(--ink-2);margin-bottom:8px">المبلغ الكلي: <b class="num">${money(p.totalAmount)}</b></p>` : ""}
    <div class="seg tl-filter" role="tablist">${[["all","الكل"],["paid","القديمة"],["due","الحالية والجاية"]].map(([k,l]) => `<button data-f="${k}" class="${tlFilter===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="tl">${tl || '<p style="color:var(--ink-3);padding:12px 0">مفيش حاجة هنا.</p>'}</div>
    <div class="d-actions">
      ${p.completed ? `<button class="btn" id="dReopen">رجّعه نشط</button>` : `<button class="btn primary" id="dDone">تم الانتهاء</button>`}
      <button class="btn danger" id="dDel">حذف</button>

}
function bindDetail(pid){

  body.onclick = e => {
    const f = e.target.closest("[data-f]"); if (f){ tlFilter = f.dataset.f; return re(); }
    const up = e.target.closest("[data-unpay]"); if (up){ const d = structuredClone(S.plans[pid].data); delete d.payments[up.dataset.unpay]; putPlan(pid, d); re(); renderView(false); return toast("اتلغى الدفع"); }
    const dp = e.target.closest("[data-dpay]"); if (dp) return openPay(pid, dp.dataset.dpay);
  };
  $("#dEdit").onclick = () => openForm(pid);
  const done = $("#dDone"); if (done) done.onclick = () => {
    const s = planStats(S.plans[pid].data);

  };

/* ================= add / edit form ================= */
function openForm(pid){
  const ex = pid ? S.plans[pid].data : null;
  const F = ex ? structuredClone(ex) : {kind:"new", freq:"monthly", phases:[], extras:[]};
  F.phases = F.phases || []; F.extras = F.extras || [];
  const isEdit = !!ex;
  const body = `<form id="pf" novalidate>
    ${isEdit ? "" : `<div class="seg big" style="margin-bottom:16px" id="kind"><button type="button" data-k="new" class="${F.kind!=="old"?"on":""}">قسط جديد</button><button type="button" data-k="old" class="${F.kind==="old"?"on":""}">قسط قديم شغال</button></div>`}
    <div class="field"><label for="f_name">اسم القسط</label><input id="f_name" class="input" placeholder="مثلاً: الشقة، العربية، التلاجة" value="${esc(F.name||"")}"></div>
    <div class="field"><label>كل قد إيه؟</label><div class="seg" id="freq">${Object.keys(STEP).map(k => `<button type="button" data-v="${k}" class="${F.freq===k?"on":""}">${FREQ_AR[k]}</button>`).join("")}</div></div>
    <div class="two">
      <div class="field"><label for="f_amount">قيمة القسط</label><input id="f_amount" class="input num" inputmode="decimal" placeholder="٠" value="${F.amount??""}"></div>
      <div class="field"><label for="f_count">عدد الأقساط</label><input id="f_count" class="input num" inputmode="numeric" placeholder="مثلاً ٦٠" value="${F.count??""}"></div>
    </div>
    <div id="dateBox"></div>
    <div class="field"><label for="f_total">المبلغ الكلي (اختياري)</label><input id="f_total" class="input num" inputmode="decimal" placeholder="للعرض بس" value="${F.totalAmount??""}"></div>
    <div class="preview" id="pv"></div>
    <details class="adv" ${(F.lastAmount || F.phases.length || F.extras.length) ? "open" : ""}><summary>${ICON.down} خيارات متقدمة</summary>
      <div class="subbox"><h5>آخر قسط مختلف</h5><p class="d">لو آخر قسط قيمته مختلفة عن الباقي.</p>
        <input id="f_last" class="input num" inputmode="decimal" placeholder="سيبه فاضي لو زي الباقي" value="${F.lastAmount??""}"></div>
      <div class="subbox"><h5>القيمة بتتغير على مراحل</h5><p class="d">مثلاً من قسط ١ لـ ٢٤ بـ ٣٠٠٠، ومن ٢٥ لـ ٦٠ بـ ٣٥٠٠.</p>
        <div id="phs"></div><button type="button" class="add-mini" id="addPh">+ إضافة مرحلة</button></div>
      <div class="subbox"><h5>دفعات إضافية</h5><p class="d">دفعة سنوية، دفعة استلام، أو أي مبلغ في تاريخ معين.</p>
        <div id="exs"></div><button type="button" class="add-mini" id="addEx">+ إضافة دفعة</button></div>
    </details>
    <div class="err-msg hidden" id="fe"></div>
    <button class="btn primary block" id="fsave" style="margin-top:8px">${isEdit ? "حفظ التعديلات" : "إضافة القسط"}</button>
  </form>`;
  openSheet(isEdit ? "تعديل القسط" : "قسط جديد", body);
  const val = id => $("#" + id)?.value.trim() ?? "";
  const n = id => { const v = parseFloat(val(id).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d.]/g,"")); return isNaN(v) ? null : v; };
  function drawDate(){
    const old = F.kind === "old" && !isEdit;
    $("#dateBox").innerHTML = old ? `<div class="two">
        <div class="field"><label for="f_lastNo">رقم آخر قسط اتدفع</label><input id="f_lastNo" class="input num" inputmode="numeric" value="${F._lastNo??""}"></div>
        <div class="field"><label for="f_lastDate">تاريخه</label><input id="f_lastDate" type="date" class="input" value="${F._lastDate??""}"></div></div>`
      : `<div class="field"><label for="f_first">ميعاد أول قسط</label><input id="f_first" type="date" class="input" value="${F.firstDate||todayISO()}"></div>`;
    $("#dateBox").oninput = preview;
  }
  function drawPh(){
    $("#phs").innerHTML = F.phases.map((ph,i) => `<div class="mini-row" style="grid-template-columns:1fr 1fr 1.4fr 34px">
      <input class="input num" inputmode="numeric" placeholder="من" aria-label="من قسط" data-ph="${i}" data-k="from" value="${ph.from??""}">
      <input class="input num" inputmode="numeric" placeholder="لـ" aria-label="لقسط" data-ph="${i}" data-k="to" value="${ph.to??""}">
      <input class="input num" inputmode="decimal" placeholder="القيمة" aria-label="القيمة" data-ph="${i}" data-k="amount" value="${ph.amount??""}">
      <button type="button" class="x" data-rph="${i}" aria-label="حذف">${ICON.close}</button></div>`).join("");
  }
  function drawEx(){
    $("#exs").innerHTML = F.extras.map((e,i) => `<div style="border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px">
      <div class="mini-row" style="grid-template-columns:1fr 34px"><input class="input" placeholder="اسمها، مثلاً: الدفعة السنوية" data-ex="${i}" data-k="label" value="${esc(e.label||"")}"><button type="button" class="x" data-rex="${i}" aria-label="حذف">${ICON.close}</button></div>
      <div class="mini-row" style="grid-template-columns:1fr 1fr"><input class="input num" inputmode="decimal" placeholder="المبلغ" data-ex="${i}" data-k="amount" value="${e.amount??""}"><input type="date" class="input" data-ex="${i}" data-k="date" value="${e.date||""}" aria-label="تاريخها"></div>
      <div class="mini-row" style="grid-template-columns:1fr 1fr">
        <select class="input" data-ex="${i}" data-k="repeatMonths" aria-label="التكرار">${[[0,"مرة واحدة"],[12,"كل سنة"],[6,"كل ٦ شهور"],[3,"كل ٣ شهور"]].map(([v,l]) => `<option value="${v}" ${+e.repeatMonths===v?"selected":""}>${l}</option>`).join("")}</select>
        <input class="input num ${+e.repeatMonths ? "" : "hidden"}" inputmode="numeric" placeholder="كام مرة" data-ex="${i}" data-k="times" value="${e.times??""}" aria-label="عدد المرات">
      </div></div>`).join("");
  }
  function collect(){
    F.name = val("f_name"); F.amount = n("f_amount"); F.count = n("f_count"); F.totalAmount = n("f_total"); F.lastAmount = n("f_last");
    if ($("#f_first")) F.firstDate = val("f_first");
    if ($("#f_lastNo")){ F._lastNo = n("f_lastNo"); F._lastDate = val("f_lastDate"); }
  }
  function preview(){
    collect();
    const step = STEP[F.freq], pv = $("#pv");
    let first = F.firstDate;
    if (F.kind === "old" && !isEdit){ first = (F._lastNo && F._lastDate) ? addMonths(F._lastDate, -(F._lastNo-1)*step) : null; }
    if (!F.amount || !F.count || !first){ pv.innerHTML = "اكتب قيمة القسط وعدده والتاريخ وهتشوف الملخص هنا."; return; }
    const tmp = {...F, firstDate:first, phases:F.phases.filter(ph => ph.from && ph.to && ph.amount), extras:F.extras.filter(e => e.amount && e.date)};
    const items = schedule(tmp), total = items.reduce((s,i) => s + i.amount, 0), last = addMonths(first, (F.count-1)*step);
    let txt = `<b class="num">${num(F.count)}</b> قسط ${FREQ_AR[F.freq]}، من ${fdate(first)} لحد ${fdate(last)}.<br>الإجمالي <b class="num">${money(total)}</b>`;
    if (F.kind === "old" && !isEdit && F._lastNo){
      const nx = addMonths(_safe(F._lastDate), step);
      txt += `<br>اتدفع ${num(F._lastNo)}، والباقي ${num(Math.max(0,F.count - F._lastNo))}. القسط الجاي ${fdate(nx)}.`;
    }
    if (F.totalAmount && Math.abs(F.totalAmount - total) > 1) txt += `<br><span style="color:var(--warn)">الإجمالي المحسوب مختلف عن المبلغ الكلي بـ ${money(Math.abs(F.totalAmount - total))}</span>`;
    pv.innerHTML = txt;
  }
  const _safe = d => d || todayISO();
  drawDate(); drawPh(); drawEx(); preview();
  const form = $("#pf");
  form.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.ph != null){ F.phases[t.dataset.ph][t.dataset.k] = t.value === "" ? null : +t.value.replace(/[^\d.]/g,""); }
    if (t.dataset.ex != null){ const k = t.dataset.k; F.extras[t.dataset.ex][k] = (k === "label" || k === "date") ? t.value : (t.value === "" ? null : +t.value); if (k === "repeatMonths") drawEx(); }
    preview();
  });
  form.addEventListener("change", e => { if (e.target.dataset.k === "repeatMonths"){ F.extras[e.target.dataset.ex].repeatMonths = +e.target.value; drawEx(); preview(); } });
  form.addEventListener("click", e => {
    const k = e.target.closest("#kind [data-k]"); if (k){ collect(); F.kind = k.dataset.k; $("#kind").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === k)); drawDate(); preview(); }
    const fr = e.target.closest("#freq [data-v]"); if (fr){ F.freq = fr.dataset.v; $("#freq").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === fr)); preview(); }
    if (e.target.closest("#addPh")){ F.phases.push({}); drawPh(); }
    if (e.target.closest("#addEx")){ F.extras.push({id:uid().slice(0,8), repeatMonths:0}); drawEx(); }
    const rp = e.target.closest("[data-rph]"); if (rp){ F.phases.splice(+rp.dataset.rph,1); drawPh(); preview(); }
    const rx = e.target.closest("[data-rex]"); if (rx){ F.extras.splice(+rx.dataset.rex,1); drawEx(); preview(); }
  });
  form.onsubmit = e => {
    e.preventDefault(); collect();
    const er = $("#fe"); const fail = (m, id) => { er.textContent = m; er.classList.remove("hidden"); if (id){ $("#"+id)?.classList.add("err"); $("#"+id)?.focus(); } };
    document.querySelectorAll(".input.err").forEach(x => x.classList.remove("err"));
    if (!F.name) return fail("اكتب اسم القسط.", "f_name");
    if (!F.amount || F.amount <= 0) return fail("اكتب قيمة القسط.", "f_amount");
    if (!F.count || F.count < 1 || F.count > 600 || F.count % 1) return fail("عدد الأقساط لازم يبقى رقم صحيح.", "f_count");
    const step = STEP[F.freq];
    const out = {name:F.name, freq:F.freq, amount:F.amount, count:F.count, totalAmount:F.totalAmount||null, lastAmount:F.lastAmount||null,
      phases:F.phases.filter(p => p.from && p.to && p.amount).map(p => ({from:+p.from, to:+p.to, amount:+p.amount})),
      extras:F.extras.filter(x => x.amount && x.date).map(x => ({id:x.id, label:x.label||"", amount:+x.amount, date:x.date, repeatMonths:+x.repeatMonths||0, times:+x.repeatMonths ? Math.max(1, +x.times||1) : 1})),
      payments:F.payments||{}, completed:!!F.completed, completedAt:F.completedAt, createdAt:F.createdAt||new Date().toISOString(), kind:F.kind};
    if (F.kind === "old" && !isEdit){
      if (!F._lastNo || F._lastNo < 1 || F._lastNo > F.count) return fail("رقم آخر قسط لازم يبقى بين ١ وعدد الأقساط.", "f_lastNo");
      if (!F._lastDate) return fail("اكتب تاريخ آخر قسط اتدفع.", "f_lastDate");
      out.firstDate = addMonths(F._lastDate, -(F._lastNo-1)*step);
      const sch = schedule(out);
      sch.filter(it => !it.extra && it.no <= F._lastNo).forEach(it => out.payments[it.key] = {amount:it.amount, paidAt:it.date, imported:true});
      sch.filter(it => it.extra && it.date <= F._lastDate).forEach(it => out.payments[it.key] = {amount:it.amount, paidAt:it.date, imported:true});
    } else {
      if (!F.firstDate) return fail("حدد ميعاد أول قسط.", "f_first");
      out.firstDate = F.firstDate;
      // drop payments that no longer exist
      const keys = new Set(schedule(out).map(i => i.key)); for (const k in out.payments) if (!keys.has(k)) delete out.payments[k];
    }
    const id = pid || uid(); putPlan(id, out); closeSheet();
    toast(isEdit ? "اتحفظت التعديلات" : "اتضاف القسط");
    if (!isEdit && S.tab === "settings") go("due"); else renderView(false);
  };
}

/* ================= export / import ================= */
function needXLSX(){ if (!window.XLSX){ toast("مكتبة Excel لسه بتتحمل، جرب كمان ثانية"); return false; } return true; }
function dl(name, blob){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportExcel(){
  if (!needXLSX()) return;
  const sum = [], sch = [];
  for (const r of activePlans()){
    const p = r.data, s = planStats(p);
    sum.push({"الاسم":p.name, "النوع":FREQ_AR[p.freq], "قيمة القسط":p.amount, "عدد الأقساط":p.count, "تاريخ أول قسط":p.firstDate, "اتدفع (عدد)":s.paidCount, "اتدفع (مبلغ)":s.paid, "المتبقي":s.remaining, "القسط الجاي":s.next?.date||"", "الحالة":p.completed?"خلص":"نشط"});
    for (const it of s.items) sch.push({"القسط":p.name, "البند":it.label, "تاريخ الاستحقاق":it.date, "المستحق":it.amount, "الحالة":it.pay?"اتدفع":it.date < todayISO()?"متأخر":"لسه", "تاريخ الدفع":it.pay?.paidAt||"", "المدفوع":it.pay?.amount??"", "ملاحظة":it.pay?.note||""});
  }
  const wb = XLSX.utils.book_new();
  const a = XLSX.utils.json_to_sheet(sum), b = XLSX.utils.json_to_sheet(sch);
  a["!cols"] = Array(10).fill({wch:16}); b["!cols"] = Array(8).fill({wch:16});
  wb.Workbook = {Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb, a, "الأقساط"); XLSX.utils.book_append_sheet(wb, b, "الجدول");
  XLSX.writeFile(wb, "اقساطي-" + todayISO() + ".xlsx");
}
function exportJSON(){
  const data = {app:"aqsat", version:1, exportedAt:new Date().toISOString(), plans:activePlans().map(r => ({id:r.id, data:r.data}))};
  dl("aqsat-backup-" + todayISO() + ".json", new Blob([JSON.stringify(data, null, 1)], {type:"application/json"}));
}
const TPL_HEAD = ["الاسم","النوع (جديد/قديم)","قيمة القسط","التكرار (شهري/ربع سنوي/نصف سنوي/سنوي)","عدد الأقساط","تاريخ أول قسط (للجديد)","رقم آخر قسط اتدفع (للقديم)","تاريخ آخر قسط اتدفع (للقديم)","قيمة آخر قسط (اختياري)","المبلغ الكلي (اختياري)"];
function downloadTemplate(){
  if (!needXLSX()) return;
  const ws = XLSX.utils.aoa_to_sheet([TPL_HEAD, ["الشقة","قديم",3500,"شهري",60,"",14,"2026-09-05","",210000], ["التلاجة","جديد",1200,"شهري",12,"2026-11-01","","","",""]]);
  ws["!cols"] = TPL_HEAD.map(() => ({wch:20}));
  const wb = XLSX.utils.book_new(); wb.Workbook = {Views:[{RTL:true}]}; XLSX.utils.book_append_sheet(wb, ws, "الأقساط");
  XLSX.writeFile(wb, "قالب-الاقساط.xlsx");
}
function toISO(v){
  if (v == null || v === "") return null;
  if (typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); if (d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
  const s = String(v).trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return null;
}
async function importFile(f){
  const items = [];
  try{
    if (/\.json$/i.test(f.name)){
      const j = JSON.parse(await f.text());
      if (j.app !== "aqsat" || !Array.isArray(j.plans)) throw new Error("bad");
      for (const p of j.plans) items.push({ok:true, id:p.id, data:p.data, name:p.data?.name, note:"من النسخة الاحتياطية"});
    } else {
      if (!needXLSX()) return;
      const wb = XLSX.read(await f.arrayBuffer(), {cellDates:false});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:""}).slice(1).filter(r => r.some(c => c !== ""));
      for (const r of rows){
        const [name, kind, amount, freqAr, count, first, lastNo, lastDate, lastAmount, total] = r;
        const freq = FREQ_FROM_AR[String(freqAr).trim()] || (String(freqAr).trim() === "" ? "monthly" : null);
        const p = {name:String(name).trim(), freq, amount:+amount, count:+count, lastAmount:+lastAmount||null, totalAmount:+total||null, phases:[], extras:[], payments:{}, completed:false, createdAt:new Date().toISOString()};
        let err = !p.name ? "مفيش اسم" : !freq ? "التكرار مش مفهوم" : !(p.amount > 0) ? "قيمة القسط غلط" : !(p.count >= 1) ? "عدد الأقساط غلط" : null;
        const isOld = String(kind).trim() === "قديم";
        p.kind = isOld ? "old" : "new";
        if (!err && isOld){
          const ld = toISO(lastDate), ln = +lastNo;
          if (!ld || !(ln >= 1 && ln <= p.count)) err = "بيانات آخر قسط ناقصة";
          else { p.firstDate = addMonths(ld, -(ln-1)*STEP[freq]); schedule(p).filter(i => i.no <= ln).forEach(i => p.payments[i.key] = {amount:i.amount, paidAt:i.date, imported:true}); }
        } else if (!err){ p.firstDate = toISO(first); if (!p.firstDate) err = "تاريخ أول قسط غلط"; }
        items.push({ok:!err, id:uid(), data:p, name:p.name || "(بدون اسم)", note:err || (isOld ? `قديم، اتدفع ${num(+lastNo)} من ${num(p.count)}` : `جديد، ${num(p.count)} قسط ${FREQ_AR[freq]}`)});
      }
    }
  }catch(e){ return toast("الملف ده مش مفهوم. استخدم القالب أو نسخة احتياطية من التطبيق."); }
  const good = items.filter(i => i.ok);
  if (!items.length) return toast("الملف فاضي");
  openSheet("معاينة الاستيراد", `<p>هيتضاف <b class="num">${num(good.length)}</b> قسط${items.length - good.length ? `، و${num(items.length - good.length)} فيهم مشكلة ومش هيتضافوا` : ""}.</p>
    <div class="import-list">${items.map(i => `<div class="${i.ok ? "" : "bad"}"><b>${esc(i.name)}</b><span>${esc(i.note)}</span></div>`).join("")}</div>
    <button class="btn primary block" id="impOk" ${good.length ? "" : "disabled"}>إضافة ${num(good.length)} قسط</button>`);
  $("#impOk").onclick = () => {
    for (const i of good){ const id = S.plans[i.id] && !S.plans[i.id].deleted ? uid() : i.id; S.plans[id] = {id, data:i.data, deleted:false, updated_at:new Date().toISOString(), dirty:true}; }
    saveLocal(); queueSync(); closeSheet(); toast("اتضاف " + num(good.length) + " قسط"); go("plans");
  };
}

/* ================= start ================= */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
